<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopSphere</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span>🛍️</span> ShopSphere
      </a>
      
      <div class="nav-right">
        <a href="cart.html" class="cart-icon">
          🛒
          <span id="cart-badge"></span>
        </a>
      </div>

      <button class="menu-toggle" id="menu-toggle">☰</button>
    </div>

    <ul class="nav-menu" id="nav-menu">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="products.html" class="nav-link">Products</a></li>
      <li><a href="cart.html" class="nav-link">Cart</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <section class="checkout-section">
      <!-- Checkout Form -->
      <div>
        <form id="checkout-form" class="checkout-form">
          <!-- Shipping Information -->
          <div class="form-section">
            <h3>Shipping Information</h3>

            <div class="form-group">
              <label for="shipping_name">Full Name *</label>
              <input type="text" id="shipping_name" name="shipping_name" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="shipping_email">Email Address *</label>
                <input type="email" id="shipping_email" name="shipping_email" required>
              </div>
              <div class="form-group">
                <label for="shipping_phone">Phone Number *</label>
                <input type="tel" id="shipping_phone" name="shipping_phone" required>
              </div>
            </div>

            <div class="form-group">
              <label for="shipping_address">Street Address *</label>
              <input type="text" id="shipping_address" name="shipping_address" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="shipping_city">City *</label>
                <input type="text" id="shipping_city" name="shipping_city" required>
              </div>
              <div class="form-group">
                <label for="shipping_state">State/Province *</label>
                <input type="text" id="shipping_state" name="shipping_state" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="shipping_zip">ZIP/Postal Code *</label>
                <input type="text" id="shipping_zip" name="shipping_zip" required>
              </div>
              <div class="form-group">
                <label for="shipping_country">Country *</label>
                <input type="text" id="shipping_country" name="shipping_country" required>
              </div>
            </div>
          </div>

          <!-- Billing Address -->
          <div class="form-section">
            <div class="checkbox-group">
              <input type="checkbox" id="same_address" name="same_address" checked 
                onchange="Checkout.toggleBillingAddress()">
              <label for="same_address" style="margin: 0;">Billing address same as shipping</label>
            </div>

            <div id="billing-address-section" style="display: none; margin-top: 1rem;">
              <h3 style="margin-bottom: 1rem;">Billing Address</h3>

              <div class="form-group">
                <label for="billing_name">Full Name *</label>
                <input type="text" id="billing_name" name="billing_name">
              </div>

              <div class="form-group">
                <label for="billing_address">Street Address *</label>
                <input type="text" id="billing_address" name="billing_address">
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="billing_city">City *</label>
                  <input type="text" id="billing_city" name="billing_city">
                </div>
                <div class="form-group">
                  <label for="billing_state">State/Province *</label>
                  <input type="text" id="billing_state" name="billing_state">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="billing_zip">ZIP/Postal Code *</label>
                  <input type="text" id="billing_zip" name="billing_zip">
                </div>
                <div class="form-group">
                  <label for="billing_country">Country *</label>
                  <input type="text" id="billing_country" name="billing_country">
                </div>
              </div>
            </div>
          </div>

          <!-- Payment Information -->
          <div class="form-section">
            <h3>Payment Method</h3>

            <div class="form-group">
              <label for="payment_method">Select Payment Method *</label>
              <select id="payment_method" name="payment_method" required>
                <option value="">Choose a payment method</option>
                <option value="credit_card">Credit Card</option>
                <option value="debit_card">Debit Card</option>
                <option value="paypal">PayPal</option>
                <option value="bank_transfer">Bank Transfer</option>
              </select>
            </div>

            <div class="form-group">
              <label for="card_number">Card Number *</label>
              <input type="text" id="card_number" name="card_number" placeholder="1234 5678 9012 3456" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="card_expiry">Expiry Date *</label>
                <input type="text" id="card_expiry" name="card_expiry" placeholder="MM/YY" required>
              </div>
              <div class="form-group">
                <label for="card_cvv">CVV *</label>
                <input type="text" id="card_cvv" name="card_cvv" placeholder="123" maxlength="4" required>
              </div>
            </div>

            <p style="color: var(--text-light); font-size: 0.875rem; margin-top: 1rem;">
              💳 Demo mode: Use any valid card numbers (e.g., 4532 1234 5678 9010)
            </p>
          </div>

          <button type="submit" class="btn btn-primary btn-large">Complete Purchase</button>
          <a href="cart.html" class="btn btn-secondary btn-large" style="margin-top: 0.5rem; display: block;">
            Return to Cart
          </a>
        </form>
      </div>

      <!-- Order Summary -->
      <div class="cart-summary">
        <h3>Order Summary</h3>
        
        <div id="order-summary">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </section>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2024 ShopSphere. All rights reserved. | A Modern E-Commerce Platform</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
