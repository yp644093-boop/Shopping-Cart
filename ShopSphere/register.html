<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ShopSphere</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span>🛍️</span> ShopSphere
      </a>
      
      <div class="nav-right">
        <a href="cart.html" class="cart-icon">
          🛒
          <span id="cart-badge"></span>
        </a>
      </div>

      <button class="menu-toggle" id="menu-toggle">☰</button>
    </div>

    <ul class="nav-menu" id="nav-menu">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="products.html" class="nav-link">Products</a></li>
      <li><a href="cart.html" class="nav-link">Cart</a></li>
    </ul>
  </nav>

  <!-- Registration Form -->
  <div class="auth-container">
    <h2>Create Your Account</h2>

    <form id="register-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
        <small style="color: var(--text-light);">Minimum 6 characters</small>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required placeholder="••••••••" minlength="6">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms" style="margin: 0;">
          I agree to the 
          <a href="#" style="color: var(--primary-color);">Terms and Conditions</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-large">Create Account</button>

      <div class="form-divider">or</div>

      <div class="auth-links">
        Already have an account? 
        <a href="login.html">Login here</a>
      </div>
    </form>

    <p style="text-align: center; margin-top: 2rem; color: var(--text-light); font-size: 0.875rem;">
      Demo: Password must be at least 6 characters
    </p>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2024 ShopSphere. All rights reserved. | A Modern E-Commerce Platform</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        await API.registerUser(name, email, password);
        Auth.updateNavbar();
        
        // Redirect to products
        window.location.href = 'products.html';
      } catch (error) {
        alert('Registration failed: ' + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
