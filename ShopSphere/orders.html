<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ShopSphere</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span>🛍️</span> ShopSphere
      </a>
      
      <div class="nav-right">
        <form id="search-form" class="search-form" style="margin-right: 2rem;">
          <input type="text" id="search-input" placeholder="Search products..." 
            style="padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius); width: 250px;">
        </form>

        <div id="auth-nav" class="nav-right" style="margin: 0;">
          <a href="login.html" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Login</a>
          <a href="register.html" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Register</a>
        </div>

        <div id="user-nav" style="display: none; align-items: center; gap: 1rem;">
          <span style="color: var(--text-color);">👤 <span id="user-name">User</span></span>
          <button onclick="Auth.logout()" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Logout</button>
        </div>

        <a href="cart.html" class="cart-icon">
          🛒
          <span id="cart-badge"></span>
        </a>
      </div>

      <button class="menu-toggle" id="menu-toggle">☰</button>
    </div>

    <ul class="nav-menu" id="nav-menu">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="products.html" class="nav-link">Products</a></li>
      <li><a href="cart.html" class="nav-link">Cart</a></li>
      <li><a href="orders.html" class="nav-link active">Orders</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <section class="orders-section">
      <h2>My Orders</h2>

      <div id="empty-orders" style="display: none;" class="empty-orders">
        <p style="font-size: 1.1rem; margin-bottom: 1rem;">No orders yet</p>
        <p style="margin-bottom: 1rem;">Start shopping to place your first order</p>
        <a href="products.html" class="btn btn-primary">Browse Products</a>
      </div>

      <div id="orders-list">
        <!-- Loaded dynamically -->
      </div>
    </section>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2024 ShopSphere. All rights reserved. | A Modern E-Commerce Platform</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
