<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopSphere</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span>🛍️</span> ShopSphere
      </a>
      
      <div class="nav-right">
        <a href="cart.html" class="cart-icon">
          🛒
          <span id="cart-badge"></span>
        </a>
      </div>

      <button class="menu-toggle" id="menu-toggle">☰</button>
    </div>

    <ul class="nav-menu" id="nav-menu">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="products.html" class="nav-link">Products</a></li>
      <li><a href="cart.html" class="nav-link">Cart</a></li>
    </ul>
  </nav>

  <!-- Login Form -->
  <div class="auth-container">
    <h2>Login to Your Account</h2>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember" style="margin: 0;">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary btn-large">Login</button>

      <div class="form-divider">or</div>

      <div class="auth-links">
        Don't have an account? 
        <a href="register.html">Register here</a>
      </div>
    </form>

    <p style="text-align: center; margin-top: 2rem; color: var(--text-light); font-size: 0.875rem;">
      Demo: Use any email and password (min 6 chars) to login
    </p>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2024 ShopSphere. All rights reserved. | A Modern E-Commerce Platform</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        await API.loginUser(email, password);
        Auth.updateNavbar();
        
        // Redirect to products or previous page
        const redirectUrl = localStorage.getItem('redirect_after_login') || 'products.html';
        localStorage.removeItem('redirect_after_login');
        window.location.href = redirectUrl;
      } catch (error) {
        alert('Login failed: ' + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
